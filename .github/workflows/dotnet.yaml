name: myworkflow
on:
  push:
    branches: [ "main" ]
permissions:
    contents: write
jobs:
    build:
        name: Publish Binaries
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
            # The release tag comes from <Version> in the csproj, so bumping the
            # version there is the only step needed to publish a new release.
            - name: Read version from csproj
              id: version
              shell: pwsh
              run: |
                $version = "$(([xml](Get-Content YT2MP3Sharp.csproj)).Project.PropertyGroup.Version)".Trim()
                if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version '$version' in YT2MP3Sharp.csproj" }
                "version=$version" >> $env:GITHUB_OUTPUT
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
               dotnet-version: 8.0.x
            - name: Restore dependencies
              run: dotnet restore
            - name: Build
              run: dotnet build --no-restore
            - name: Publish
              run: dotnet publish -c Release -o ./bin
            - name: Download ffmpeg
              run: |
                curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
                7z e ffmpeg.zip -o"." "ffmpeg-*-essentials_build/bin/ffmpeg.exe" -r
                move ffmpeg.exe ./bin/Release/net8.0/
            - name: Archive
              run: 7z a -tzip publish.zip ./bin/Release/net8.0/*
            - name: Upload
              uses: svenstaro/upload-release-action@v2
              with:
                repo_token: ${{ secrets.GITHUB_TOKEN }}
                file: publish.zip
                asset_name: YT2MP3Sharp.zip
                tag: ${{ steps.version.outputs.version }}
                release_name: YT2MP3Sharp ${{ steps.version.outputs.version }}
                overwrite: true
                body: "YT2MP3Sharp ${{ steps.version.outputs.version }} for Windows, ffmpeg included."
                        